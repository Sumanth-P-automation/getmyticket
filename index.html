<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GetMYticket.IE: cinema and event tickets (demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F5;--s1:#FFFFFF;--s2:#E9E9EE;--ink:#333545;--mut:#6B6E7D;--line:#E2E2E8;
  --acc:#E63950;--onacc:#FFFFFF;--grn:#1F9D3A;--amb:#C77700;--red:#D32F2F;--ongrn:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F14;--s1:#1A1A23;--s2:#262631;--ink:#F3F4F8;--mut:#A2A5B5;--line:rgba(255,255,255,.12);
  --acc:#FF5470;--onacc:#2A0610;--grn:#4ADE80;--amb:#FBBF24;--red:#FF7A7A;--ongrn:#052E16;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F0F14;--s1:#1A1A23;--s2:#262631;--ink:#F3F4F8;--mut:#A2A5B5;--line:rgba(255,255,255,.12);
  --acc:#FF5470;--onacc:#2A0610;--grn:#4ADE80;--amb:#FBBF24;--red:#FF7A7A;--ongrn:#052E16;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body.hasbar .wrap{padding-bottom:180px}
body.noscroll{overflow:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 56px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.015em;margin:0}
h2{font-weight:700;font-size:21px;margin:22px 0 12px}
.sub{color:var(--mut);margin:0}
button{font-family:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:6px;font:800 26px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em}
.lgt{display:inline-flex;align-items:center;gap:7px;font:800 27px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;color:#fff;line-height:1}
.lgt b{color:#fff;font-weight:800;margin-left:0;font-size:1em}
.lgt .rl{width:30px;height:30px;margin-right:8px;flex:none}
.lgt{white-space:nowrap;align-items:center}
.lgt em{font-style:normal;background:var(--acc);color:#fff;border-radius:7px;padding:3px 7px 4px;margin:0 3px;letter-spacing:0}
.lgt{gap:0}
.lgt .tk{width:30px;height:22px;flex:none}
.navin.hm{grid-template-columns:1fr;grid-template-areas:"logo" "loc" "sq";justify-items:center;gap:6px}
.navin.hm .logo{justify-self:center}
.navin.hm .loc{padding:0 4px 0 9px;gap:2px}
.navin.hm .loc span{font-size:11px}
.navin.hm .loc select{font-size:12px;padding:4px 4px;max-width:110px}
.navin.hm .sq{width:100%;max-width:560px}
.logo i{font-style:normal;background:var(--acc);color:var(--onacc);border-radius:8px;padding:0 7px;line-height:1.25}
.loc{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 12px}
.loc select{border:0;background:none;color:var(--ink);font:500 15px Inter,system-ui,sans-serif;padding:9px 6px;max-width:140px}
.demo{background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--acc);padding:9px 12px;border-radius:10px;font-size:13px;color:var(--mut);margin:0 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;padding:10px;border-radius:11px;font:700 16px "Bricolage Grotesque",system-ui,sans-serif;color:var(--mut);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--s1);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.18)}
input[type=search]{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--ink);font:400 16px Inter,system-ui,sans-serif;margin-bottom:12px}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.row::-webkit-scrollbar,.hrow::-webkit-scrollbar,.days::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);padding:8px 15px;border-radius:999px;font:500 14px Inter,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 0 14px;scrollbar-width:none}
.hc{flex:0 0 88%;scroll-snap-align:center;position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;border:0;padding:0;text-align:left;color:#fff;cursor:pointer;background:#111}
.hbg,.hbg svg,.fbg,.fbg svg,.poster>svg,.sart,.sart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hsh{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0) 70%)}
.hin{position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.hin b{font:800 clamp(22px,6.4vw,31px)/1.05 "Bricolage Grotesque",system-ui,sans-serif}
.hm{font-size:13px;opacity:.92}
.pb{position:absolute;top:10px;left:10px;background:var(--acc);color:var(--onacc);font:600 12px Inter,system-ui,sans-serif;padding:3px 9px;border-radius:7px}
.pb.s{position:static}
.pd{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font:500 12px Inter,system-ui,sans-serif;padding:3px 9px;border-radius:7px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.poster{aspect-ratio:2/3;position:relative;overflow:hidden;border-radius:16px;background:#111;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.pshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,0) 55%)}
.pt{position:absolute;left:12px;right:12px;bottom:12px;color:#fff;font:800 20px/1.08 "Bricolage Grotesque",system-ui,sans-serif;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.card .cm{display:block;font-size:13px;color:var(--mut);margin-top:6px}
.card .ct{display:block;font-weight:500;margin-top:8px;font-size:14px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--mut)}
.round{width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:26px;line-height:1;cursor:pointer;backdrop-filter:blur(6px);flex:none}
.round2{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--s1);font-size:26px;line-height:1;cursor:pointer;flex:none}
.fh{position:relative;overflow:hidden;border-radius:24px;padding:14px 16px 18px;color:#fff;background:#111}
.fbg{filter:blur(14px) saturate(1.2);transform:scale(1.25)}
.fsh{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,.78))}
.fh>*:not(.fbg):not(.fsh){position:relative}
.frow{display:flex;gap:16px;align-items:flex-end;margin-top:34px}
.poster.sm{width:116px;flex:none;border-radius:12px}
.fi h1{font:800 clamp(25px,7vw,34px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin-bottom:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:rgba(255,255,255,.2);border-radius:7px;padding:2px 9px;font-size:13px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.facts div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px}
.facts b{display:block;font:700 18px "Bricolage Grotesque",system-ui,sans-serif}
.facts span{font-size:12px;color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--s1);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:14px;padding:14px 24px;font:700 16px "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mh h1{font:800 22px/1.1 "Bricolage Grotesque",system-ui,sans-serif}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.day{flex:none;width:62px;border:1px solid var(--line);background:var(--s1);border-radius:14px;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.day span,.day small{font-size:12px;color:var(--mut)}
.day b{font:700 20px "Bricolage Grotesque",system-ui,sans-serif}
.day[aria-pressed="true"]{background:var(--acc);border-color:var(--acc)}
.day[aria-pressed="true"] span,.day[aria-pressed="true"] small,.day[aria-pressed="true"] b{color:var(--onacc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:6px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cin{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.dist{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:1px 7px;white-space:nowrap}
.dist.near{color:var(--grn);border-color:var(--grn)}
.cm.dd{color:var(--acc);font-weight:600}
.locbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:0 0 12px;font-size:13px;color:var(--mut)}
.locbar button{border:1px solid var(--acc);background:none;color:var(--acc);border-radius:999px;padding:6px 12px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.vloc{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);text-align:left}
.vloc b{display:block;font-size:16px}
.vloc .sub{margin:2px 0 10px}
.vloc .vb{display:flex;gap:8px;flex-wrap:wrap}
.vloc a{text-decoration:none;border:1.5px solid var(--acc);color:var(--acc);border-radius:10px;padding:9px 14px;font:600 14px Inter,system-ui,sans-serif}
.vloc a.fill{background:var(--acc);color:var(--onacc)}
.tnl{display:block;font-size:13px;color:var(--mut);margin:12px 0}
.tn{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:500 16px Inter,system-ui,sans-serif;background:var(--s1);color:inherit}
.tiny2{display:block;font-size:12px;color:var(--mut);margin-top:6px}
.chain{margin-left:8px;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.times{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{background:none;border:1.5px solid;border-radius:10px;padding:8px 14px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.ok{color:var(--grn);border-color:var(--grn)}.mid{color:var(--amb);border-color:var(--amb)}.low{color:var(--red);border-color:var(--red)}
.curve{display:block;width:86%;margin:20px auto 2px}
.scrl{text-align:center;font-size:12px;color:var(--mut);margin-bottom:16px;letter-spacing:.1em;text-transform:uppercase}
.seats{overflow-x:auto;padding:0 0 8px}
.sr{display:flex;gap:6px;justify-content:center;margin-bottom:7px;align-items:center}
.rl{width:16px;font-size:12px;color:var(--mut)}
.aisle{width:16px}
.seat{width:25px;height:24px;border-radius:9px 9px 5px 5px;border:1.5px solid var(--grn);background:color-mix(in srgb,var(--grn) 14%,transparent);font-size:11px;cursor:pointer;padding:0;color:var(--ongrn)}
.seat.prem{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.seat.sel{background:var(--grn);border-color:var(--grn)}
.seat.bk{background:var(--s2);border-color:var(--s2);cursor:not-allowed}
.sn{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:8px;background:var(--s1);border:1px solid var(--line);border-radius:16px}
.sn .ic{font-size:26px;width:38px;text-align:center}
.sn>div:nth-child(2){flex:1}
.step{display:flex;align-items:center;gap:12px}
.stp{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--acc);background:none;color:var(--acc);font-size:20px;line-height:1;cursor:pointer;padding:0}
.stp:disabled{opacity:.3;cursor:not-allowed}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border-bottom:0;font-weight:600;font-size:18px}
.stub{background:var(--s1);border-radius:22px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.sart{position:relative;height:150px;overflow:hidden}
.sart::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,0))}
.sart b{position:absolute;left:16px;right:16px;bottom:12px;z-index:1;color:#fff;font:800 24px/1.1 "Bricolage Grotesque",system-ui,sans-serif}
.perf{position:relative;border-top:2px dashed var(--line)}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.perf::before{left:-10px}.perf::after{right:-10px}
.stubbody{padding:14px 18px 18px}
.qr{display:grid;grid-template-columns:repeat(11,1fr);width:132px;margin:14px 0 8px;border:6px solid #fff;background:#fff;border-radius:6px}
.qr i{aspect-ratio:1;background:#fff}.qr i.on{background:#111}
.note{font-size:13px;color:var(--mut);margin-top:20px}
.hint{font-size:13px;color:var(--mut);margin:10px 0 0}
.sv{position:fixed;inset:0;background:#000;color:#fff;z-index:30;display:flex;flex-direction:column}
.svs{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.svs::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0) 55%,rgba(0,0,0,.65))}
.stage{position:absolute;left:0;top:0;width:400px;height:520px;transform-origin:0 0}
.lay{position:absolute;left:0;top:0;width:400px;height:520px}
.scr{position:absolute;left:0;top:0;width:400px;height:200px;transform-origin:0 0;overflow:hidden;box-shadow:0 0 40px rgba(255,255,255,.12)}
.scr svg{display:block;width:100%;height:100%}
.svt{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;right:14px;display:flex;align-items:center;gap:10px;z-index:2}
.pillv{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;backdrop-filter:blur(6px)}
.pillv i{width:8px;height:8px;border-radius:50%;background:#6EE7B7}
.sheet{background:linear-gradient(180deg,#171413,#0C0A0B);border-radius:26px 26px 0 0;padding:16px 18px calc(14px + env(safe-area-inset-bottom,0px));flex:none;box-shadow:0 -10px 30px rgba(0,0,0,.5);position:relative;z-index:2}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.zone{color:#6EE7B7;font:600 12px Inter,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.sheet h2{font:800 30px/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:4px 0 2px}
.sub2{color:#A3A3A3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:rgba(255,255,255,.07);border-radius:14px;padding:12px}
.stat b{display:block;font:700 21px "Bricolage Grotesque",system-ui,sans-serif}
.stat span{font-size:12px;color:#A3A3A3}
.acts{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.ghost{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:14px;font:600 16px Inter,system-ui,sans-serif;cursor:pointer}
.white{background:#F4F2EE;color:#111;border:0;border-radius:999px;padding:14px;font:700 16px Inter,system-ui,sans-serif;cursor:pointer}
.tiny{font-size:11px;color:#7A7A7A;text-align:center;margin:8px 0 0}

/* BookMyShow-style theme */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#333545;z-index:40}
.wrap.narrow{max-width:760px}
.nav{background:#333545;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.navin{max-width:1100px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"logo loc" "sq sq";gap:10px 14px;align-items:center}
.navin .logo{grid-area:logo;justify-self:start;background:none;border:0;color:#fff;padding:0;cursor:pointer}
.navin .sq{grid-area:sq;margin:0;padding:10px 14px;border-radius:6px;border:0;background:#fff;color:#333545;font-size:15px}
.navin .loc{grid-area:loc;background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.navin .loc select{color:#fff;font-size:14px}
.navin select option{color:#111;background:#fff}
@media (min-width:720px){.navin{grid-template-columns:auto 1fr auto;grid-template-areas:"logo sq loc"}}
.tabs{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:24px;border-top:1px solid rgba(255,255,255,.12)}
.tabs button{background:none;border:0;color:#C9CBD6;padding:11px 0;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--acc)}
h2{font-size:22px}
.chip{border-radius:8px}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 12%,transparent);border-color:var(--acc);color:var(--acc)}
.hc{border-radius:10px}
@media (min-width:760px){.hc{flex-basis:calc(50% - 6px)}}
.grid{grid-template-columns:repeat(2,1fr)}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:980px){.grid{grid-template-columns:repeat(5,1fr)}}
.grp{grid-column:1/-1;font-size:18px;margin:12px 0 -4px;padding-top:14px;border-top:1px solid var(--line)}
.grp:first-child{border-top:0;padding-top:0;margin-top:0}
.poster{border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.poster>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pt,.pshade{display:none}
.poster .pb{top:auto;left:0;right:0;bottom:0;border-radius:0;background:rgba(0,0,0,.82);color:#fff;padding:6px 10px;font-size:12px}
.card .ct{font-weight:600;font-size:15px;line-height:1.25;margin-top:8px}
.card .cm{margin-top:2px}
.btn{border-radius:8px}
.pill{border-radius:6px}
.fh{border-radius:12px}
.qrbox{width:176px;padding:8px;background:#fff;border-radius:8px;margin:14px 0 8px;color:#333}
.navtix{grid-area:loc;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:9px 14px;font:500 14px Inter,system-ui,sans-serif;cursor:pointer}
.tabs .tr{margin-left:auto;font-weight:500}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--line)}
.ghostb{margin-top:14px;background:none;border:1.5px solid var(--red);color:var(--red);border-radius:8px;padding:10px 16px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.mt{display:flex;gap:12px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;cursor:pointer;align-items:center}
.mtart{position:relative;width:60px;height:80px;border-radius:8px;overflow:hidden;flex:none}
.mtart svg{position:absolute;inset:0;width:100%;height:100%}
.mti{display:flex;flex-direction:column;gap:2px}

function homog(w,h,q){
  var src=[[0,0],[w,0],[w,h],[0,h]],M=[],i,j,k;
  for(i=0;i<4;i++){var x=src[i][0],y=src[i][1],X=q[i][0],Y=q[i][1];
    M.push([x,y,1,0,0,0,-x*X,-y*X,X]);M.push([0,0,0,x,y,1,-x*Y,-y*Y,Y]);}
  for(i=0;i<8;i++){var p=i;for(j=i+1;j<8;j++)if(Math.abs(M[j][i])>Math.abs(M[p][i]))p=j;var t=M[i];M[i]=M[p];M[p]=t;
    for(j=i+1;j<8;j++){var f=M[j][i]/M[i][i];for(k=i;k<9;k++)M[j][k]-=f*M[i][k];}}
  var s=[];for(i=7;i>=0;i--){var sum=M[i][8];for(j=i+1;j<8;j++)sum-=M[i][j]*s[j];s[i]=sum/M[i][i];}
  return "matrix3d("+[s[0],s[3],0,s[6],s[1],s[4],0,s[7],0,0,1,0,s[2],s[5],0,1].map(function(v){return +v.toFixed(6);}).join(",")+")";
}

    }
  }
  var gd='<defs>';
  for(var j=1;j<=3;j++){gd+='<linearGradient id="sb'+j+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(8 62% '+(32-j*5)+'%)"/><stop offset="1" stop-color="hsl(8 65% '+(12-j*2)+'%)"/></linearGradient>';}
  gd+='</defs>';

    '<ellipse cx="'+f1(cen[0])+'" cy="'+f1(cen[1])+'" rx="'+f1(w*.85)+'" ry="'+f1(w*.55)+'" fill="url(#glow)"/><polygon points="'+[pt(q[0]),pt(q[1]),"430,-30","-30,-30"].join(" ")+'" fill="#000" fill-opacity=".6"/></svg>';
  return '<div class="stage" id="stage">'+bg+'<div class="scr" style="transform:'+homog(400,200,q)+'">'+art(kindOf(f),seed,400,200)+'</div><svg class="lay" viewBox="0 0 400 520" aria-hidden="true">'+gd+fg+'</svg></div>';
}
function svHTML(){
  var g=seatGeo(S.pv),k=key(),pr=price(S.pv),prem="DEF".indexOf(S.pv.charAt(0))>-1,first=S.seats.length===0;
  var zone=g.r<=1?"Up close":g.r===2?"Close":g.r<=5?"Best view":"Far back";
  var side=g.x<-0.7?"left of centre":g.x>0.7?"right of centre":"";
  var third=side?'<b>'+Math.abs(g.x).toFixed(1)+' m</b><span>'+side+'</span>':'<b>Centred</b><span>on the screen</span>';
  var mm='<svg viewBox="0 0 96 76" width="96" height="76" aria-hidden="true"><path d="M10 7 Q48 1 86 7" stroke="#fff" stroke-opacity=".8" stroke-width="1.6" fill="none"/>';
  "ABCDEFGH".split("").forEach(function(r,ri){for(var c=1;c<=10;c++){
    var id=r+c,x=8+(c-1)*7.6+(c>5?7:0),y=16+ri*7.4,tk=hash(k+id)%100<30||taken(k,id),sel=S.seats.indexOf(id)>-1;
    mm+=id===S.pv?'<circle cx="'+(x+2.5)+'" cy="'+(y+2)+'" r="3.6" fill="#6EE7B7"/>':'<rect x="'+x+'" y="'+y+'" width="5" height="4" rx="1" fill="'+(sel?"#6EE7B7":"#fff")+'" fill-opacity="'+(sel?".8":tk?".12":".38")+'"/>';
  }});
  mm+='</svg>';
  return '<div class="sv"><div class="svs" id="svs">'+stageHTML(g)+'<div class="svt"><button class="round" data-a="svback" aria-label="Back to seat map">‹</button><span class="pillv"><i></i>View from '+S.pv+'</span></div></div>'+
  '<div class="sheet"><div class="sh"><div><div class="zone">'+zone+'</div><h2>Row '+S.pv.charAt(0)+', Seat '+g.c+'</h2><div class="sub2">'+(prem?"Premium":"Standard")+' · '+money(pr)+'</div></div>'+mm+'</div>'+
  '<div class="stats"><div class="stat"><b>'+g.d.toFixed(1)+' m</b><span>to screen</span></div><div class="stat"><b>'+fovOf(g)+'°</b><span>field of view</span></div><div class="stat">'+third+'</div></div>'+
  (S.seats.length>1?'<div class="angles"><span>Different angle</span>'+S.seats.map(function(id){return '<button class="chip'+(id===S.pv?' on':'')+'" data-a="svview" data-s="'+id+'">'+id+'</button>';}).join("")+'</div>':'')+
  '<div class="acts"><button class="ghost" data-a="svremove">Change seat</button><button class="white" data-a="svbook">'+(S.seats.length===S.qty?'Book · '+money(seatTotal()):'Pick next seat')+'</button></div>'+
  '<p class="tiny">Approximate view from a sample hall layout.</p></div></div>';
}
function fit(){
  var a=$("svs"),b=$("stage");
  if(!a||!b||!a.getBoundingClientRect||!b.style) return;
  var r=a.getBoundingClientRect(),s=Math.max(r.width/400,r.height/520);
  b.style.transform="translate("+((r.width-400*s)/2)+"px,"+((r.height-520*s)/2)+"px) scale("+s+")";
}
function stepper(act,attrs,q,label,max){
  return '<div class="step"><button class="stp" data-a="'+act+'" '+attrs+' data-d="-1" aria-label="Remove one '+esc(label)+'"'+(q?'':' disabled')+'>−</button><span>'+q+'</span><button class="stp" data-a="'+act+'" '+attrs+' data-d="1" aria-label="Add one '+esc(label)+'"'+(max?'':' disabled')+'>+</button></div>';
}
function snacksHTML(){
  var out="";
  ["Combos","Snacks","Drinks"].forEach(function(g){
    out+='<h2>'+g+'</h2>';
    SNACKS.filter(function(x){return x.g===g;}).forEach(function(x){
      var q=S.snacks[x.id]||0;
      out+='<div class="sn"><div class="ic" aria-hidden="true">'+x.ic+'</div><div><b>'+esc(x.n)+'</b><div class="sub">'+money(x.p)+'</div></div>'+stepper("sn",'data-id="'+x.id+'"',q,x.n,q<10)+'</div>';
    });
  });
  var st=snackTotal();
  return '<div class="mh"><button class="round2" data-a="back" aria-label="Back">‹</button><div><h1>Food and drinks</h1><div class="sub">Optional. Collect at the counter. Sample menu.</div></div></div>'+out+
  '<div class="bar"><div><b>'+(st?'Food and drinks '+money(st):'Nothing added yet')+'</b><div class="sub">Tickets '+money(seatTotal())+'</div></div><button class="btn" data-a="topay">'+(st?'Continue':'Skip')+'</button></div>';
}
function tixHTML(){
  var e=S.ev,n=S.tq.s+S.tq.p;
  var rows=[["s","Standard",e.p],["p","Premium, best view",e.p+10]].map(function(t){return '<div class="sn"><div><b>'+t[1]+'</b><div class="sub">'+money(t[2])+'</div></div>'+stepper("tq",'data-k="'+t[0]+'"',S.tq[t[0]],t[1],n<6)+'</div>';}).join("");
  return '<div class="mh"><button class="round2" data-a="back" aria-label="Back">‹</button><div><h1>'+esc(e.t)+'</h1><div class="sub">'+esc(e.venue)+' · '+esc(dlabel(e.off))+', '+e.time+'</div></div></div><h2>Choose tickets</h2>'+(n?'<div class="qveh sm">'+veh(n)+'</div>':'')+rows+
  '<div class="bar"><div><b>'+(n?n+' ticket'+(n===1?'':'s'):'Pick up to 6 tickets')+'</b></div><button class="btn" data-a="topay"'+(n?'':' disabled')+'>'+(n?'Next · '+money(evTotal()):'Next')+'</button></div>';
}
function line(a,b){return '<div><span>'+a+'</span><span>'+b+'</span></div>';}
function sLines(){
  var r=[];
  if(S.mode==="event"){var e=S.ev;r.push(["Venue",e.venue],["When",dabs(e.off)+", "+e.time]);if(S.tq.s)r.push(["Standard × "+S.tq.s,money(S.tq.s*e.p)]);if(S.tq.p)r.push(["Premium × "+S.tq.p,money(S.tq.p*(e.p+10))]);}
  else{r.push(["Cinema",S.cin],["When",dabs(S.day)+", "+S.time],["Seats "+S.seats.join(", "),money(seatTotal())]);snackLines().forEach(function(x){r.push([x.n+" × "+x.q,money(x.a)]);});}
  r.push(["Total",money(total())]);return r;
}
function sHTML(ls){return ls.map(function(l){return line(esc(l[0]),esc(l[1]));}).join("");}
function summary(){return sHTML(sLines());}
function item(){return S.mode==="event"?S.ev:S.film;}
function payHTML(){
  var x=item();
  return '<div class="mh"><button class="round2" data-a="back" aria-label="Back">‹</button><div><h1>Review booking</h1><div class="sub">'+esc(x.t)+'</div></div></div><p class="demo">Test mode. No payment is taken. Your booking details are shared with the app owner for testing.</p><label class="tnl">Your name (optional)<input id="tn" class="tn" maxlength="40" placeholder="So the owner knows who booked" value="'+esc(S.tname||(function(){try{return localStorage.getItem("ep_tname")||"";}catch(e){return "";}})())+'"></label>'+(mailOn()?'<label class="tnl">Email for your confirmation<input id="te" class="tn" type="email" inputmode="email" autocomplete="email" maxlength="80" placeholder="you@example.com" value="'+esc(S.temail||(function(){try{return localStorage.getItem("ep_temail")||"";}catch(e){return "";}})())+'"><span class="tiny2">Used only to send this confirmation.</span>'+(S.mailErr?'<span class="tiny2" style="color:var(--red);font-weight:600">'+esc(S.mailErr)+'</span>':'')+'</label>':'')+'<div class="stub" style="margin-top:0"><div class="sart">'+art(kindOf(x),hash(x.t),400,150)+'<b>'+esc(x.t)+'</b></div><div class="stubbody sum">'+summary()+'</div></div>'+
  '<div class="bar"><div><b>'+money(total())+'</b><div class="sub">Total</div></div><button class="btn" data-a="confirm">Confirm booking</button></div>';
}
function qrText(b){return ("GETMYTICKET.IE TEST TICKET\n"+b.id+"\n"+b.t+"\n"+b.lines.map(function(l){return l[0]+": "+l[1];}).join("\n")).replace(/×/g,"x").replace(/€/g,"EUR ");}
function drawQR(){var el=$("qrbox");if(!el)return;try{new QRCode(el,{text:qrText(S.tk),width:160,height:160,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.L});}catch(e){el.textContent="QR needs an internet connection to load.";}}

function venueOf(b){
  if(b.venue) return b.venue;
  var r=(b.lines||[]).filter(function(l){return l[0]==="Cinema"||l[0]==="Venue";})[0];
  return r?r[1]:"";
}
function mapsQ(v){return encodeURIComponent(v+", "+(lookup[v]?lookup[v].co+", ":"")+"Ireland");}
function venueBlock(b){
  var v=venueOf(b);if(!v||!lookup[v]) return "";
  return '<div class="vloc"><b>'+esc(v)+'</b><p class="sub">'+esc(lookup[v].co)+', Ireland · '+esc(distTxt(v))+'</p><div class="vb"><a class="fill" href="https://www.google.com/maps/dir/?api=1&destination='+mapsQ(v)+'&travelmode=driving" target="_blank" rel="noopener">Get directions</a><a href="https://www.google.com/maps/search/?api=1&query='+mapsQ(v)+'" target="_blank" rel="noopener">View on map</a></div></div>';
}
function ticketHTML(){
  var b=S.tk,food=b.food?'<p class="sub">Food and drinks: collect at the counter and show this ID.</p>':'';
  return '<div class="mh"><div><h1>'+(S.fresh?'Booking confirmed':'Your ticket')+'</h1></div></div><p class="demo">Test ticket. Not valid for entry.</p><div class="stub" style="margin-top:0"><div class="sart">'+art(b.k,hash(b.t),400,150)+'<b>'+esc(b.t)+'</b></div><div class="perf"></div><div class="stubbody"><div class="sum">'+sHTML(b.lines)+'</div>'+venueBlock(b)+mailNote(b)+'<div class="qrbox" id="qrbox" aria-label="Ticket QR code"></div><b>'+esc(b.id)+'</b>'+food+'</div></div>'+
  '<p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-a="home">Back to home</button><button class="btn alt" data-a="mytix">My tickets</button></p><button class="ghostb" data-a="cancel">'+(S.cx?'Tap again to cancel booking':'Cancel booking')+'</button>';
}
function mytixHTML(){
  var list=BK.map(function(b,i){return '<button class="mt" data-a="openbk" data-i="'+i+'"><div class="mtart">'+art(b.k,hash(b.t),120,160)+'</div><div class="mti"><b>'+esc(b.t)+'</b><span class="sub">'+esc(b.lines[1]?b.lines[1][1]:"")+'</span><span class="sub">'+esc(venueOf(b))+(lookup[venueOf(b)]?', '+esc(lookup[venueOf(b)].co):'')+'</span><span class="sub">'+esc(b.id)+' · '+money(b.total)+'</span></div></button>';}).join("");
  return '<div class="mh"><button class="round2" data-a="home" aria-label="Back">‹</button><div><h1>My tickets</h1><div class="sub">Saved on this device</div></div></div>'+(list||'<div class="empty">No bookings yet.</div>');
}
function render(){
  var v=S.view,m={home:homeHTML,film:filmHTML,evt:evHTML,times:timesHTML,seats:seatsHTML,sv:svHTML,snacks:snacksHTML,tix:tixHTML,pay:payHTML,ticket:ticketHTML,mytix:mytixHTML,qty:qtyHTML};
  $("app").innerHTML=(v==="sv"?"":navHTML(v==="home"))+'<div class="wrap'+(v==="home"?"":" narrow")+'">'+m[v]()+'</div>'+fnavHTML(v);
  document.body.classList.toggle("hasnav",v==="home"||v==="mytix");
  document.body.classList.toggle("hasbar",["film","evt","seats","snacks","tix","pay","qty"].indexOf(v)>-1);
  document.body.classList.toggle("noscroll",v==="sv"||v==="qty");
  if(v==="home"){
    drawGrid();
    $("county").onchange=function(){S.county=this.value;render();};
    $("q").oninput=function(){S.q=this.value;drawGrid();};
  }
  if(v==="sv") fit();
  if(v==="ticket") drawQR();
}
function go(v){S.view=v;render();window.scrollTo(0,0);}
if(window.addEventListener) window.addEventListener("resize",function(){if(S.view==="sv")fit();});
$("app").addEventListener("click",function(e){
  var b=e.target.closest("[data-a]"); if(!b) return;
  var a=b.getAttribute("data-a"),d=+b.getAttribute("data-d");
  if(a==="tab"){S.tab=b.getAttribute("data-t");S.q="";render();}
  else if(a==="film"){S.film=FILMS[+b.getAttribute("data-i")];S.day=0;S.mode="movie";go("film");}
  else if(a==="ev"){S.ev=EV[+b.getAttribute("data-i")];S.tq={s:0,p:0};S.mode="event";go("evt");}
  else if(a==="lang"){S.lang=b.getAttribute("data-l");render();}
  else if(a==="cat"){S.cat=b.getAttribute("data-l");render();}
  else if(a==="book"){go("times");}
  else if(a==="etix"){go("tix");}
  else if(a==="day"){S.day=+b.getAttribute("data-n");render();}
  else if(a==="geo"){getLoc();}
  else if(a==="slot"){S.cin=b.getAttribute("data-c");S.time=b.getAttribute("data-t");S.seats=[];S.snacks={};S.qty=S.qty||2;S.qnew=true;go("qty");}
  else if(a==="seat"){var id=b.getAttribute("data-s"),i=S.seats.indexOf(id),yy=window.scrollY||0;S.seatMsg="";
    if(i>-1){if(S.qty>=4)S.seats=[];else S.seats.splice(i,1);render();window.scrollTo(0,yy);}
    else if(S.qty>=4){var blk=blockFor(id);if(blk){S.seats=blk;S.pv=id;S.sy=yy;S.view="sv";render();window.scrollTo(0,0);}else{S.seatMsg="No "+S.qty+" seats together from "+id+". Try another seat or row.";render();window.scrollTo(0,yy);}}
    else if(S.seats.length<S.qty){S.seats.push(id);S.seats.sort();S.pv=id;S.sy=yy;S.view="sv";render();window.scrollTo(0,0);}
    else return;}
  else if(a==="qty"){S.qty=+b.getAttribute("data-n");render();}
  else if(a==="toseats"){if(S.seats.length>S.qty)S.seats=S.seats.slice(0,S.qty);go("seats");}
  else if(a==="chqty"){S.qnew=true;go("qty");}
  else if(a==="seat3d"){S.pv=b.getAttribute("data-s");S.sy=window.scrollY||0;S.view="sv";render();window.scrollTo(0,0);}
  else if(a==="svremove"){if(S.qty>=4)S.seats=[];else{var ri=S.seats.indexOf(S.pv);if(ri>-1)S.seats.splice(ri,1);}S.view="seats";render();window.scrollTo(0,S.sy);}
  else if(a==="svview"){S.pv=b.getAttribute("data-s");render();window.scrollTo(0,0);}
  else if(a==="svback"){S.view="seats";render();window.scrollTo(0,S.sy);}
  else if(a==="svbook"){if(S.seats.length===S.qty){go("snacks");}else{S.view="seats";render();window.scrollTo(0,S.sy);}}
  else if(a==="sn"){var k=b.getAttribute("data-id");S.snacks[k]=Math.max(0,Math.min(10,(S.snacks[k]||0)+d));render();}
  else if(a==="tq"){var t=b.getAttribute("data-k"),n=S.tq.s+S.tq.p;if(d>0&&n>=6)return;S.tq[t]=Math.max(0,S.tq[t]+d);render();}
  else if(a==="pay"){if(S.seats.length&&S.seats.length===S.qty)go("snacks");}
  else if(a==="topay"){go("pay");}
  else if(a==="confirm"){var tni=$("tn"),tnm=tni?tni.value.trim().slice(0,40):"",tei=$("te"),tem=tei?tei.value.trim().slice(0,80):"";
    if(tem&&!validEmail(tem)){S.tname=tnm;S.temail=tem;S.mailErr="That email address does not look right.";render();return;}
    S.mailErr="";try{localStorage.setItem("ep_tname",tnm);if(tem)localStorage.setItem("ep_temail",tem);}catch(e){}var x=item(),id="EP"+(100000+hash(S.mode+x.t+S.seats.join()+Date.now())%900000),mv=S.mode==="movie";S.tk={id:id,mode:S.mode,venue:(S.mode==="movie"?S.cin:x.venue),t:x.t,k:kindOf(x),lines:sLines(),total:total(),seats:mv?S.seats.slice():[],key:mv?key():"",food:mv&&snackTotal()>0,made:Date.now(),tname:tnm,email:tem};BK.unshift(S.tk);saveBK();report(S.tk,"booked");sendMail(S.tk);S.fresh=true;S.cx=false;go("ticket");}
  else if(a==="mytix"){go("mytix");}
  else if(a==="sq"){if(S.view!=="home")go("home");window.scrollTo(0,0);var qi=$("q");if(qi)qi.focus();}
  else if(a==="openbk"){S.tk=BK[+b.getAttribute("data-i")];S.fresh=false;S.cx=false;go("ticket");}
  else if(a==="cancel"){if(!S.cx){S.cx=true;render();}else{report(S.tk,"cancelled");BK=BK.filter(function(z){return z.id!==S.tk.id;});saveBK();S.cx=false;go("mytix");}}
  else if(a==="back"){go({film:"home",times:"film",seats:"qty",qty:"times",snacks:"seats",evt:"home",tix:"evt",pay:S.mode==="event"?"tix":"snacks"}[S.view]);}
  else if(a==="home"){S.seats=[];S.snacks={};S.tq={s:0,p:0};go("home");}
});
render();
function nrm(x){return x.toLowerCase().replace(/[^a-z0-9]/g,"");}
function loadPosters(){
  if(!TMDB_KEY||!window.fetch) return;
  var cache={},todo=[],left;try{cache=JSON.parse(localStorage.getItem("ep_posters")||"{}");}catch(e){}
  FILMS.forEach(function(f){if(cache[f.t]!==undefined){if(cache[f.t])POSTERS[f.t]=cache[f.t];}else todo.push(f);});
  function done(){try{localStorage.setItem("ep_posters",JSON.stringify(cache));}catch(e){}if(S.view==="home")drawGrid();}
  left=todo.length;if(!left){if(S.view==="home")drawGrid();return;}
  todo.forEach(function(f,i){setTimeout(function(){
    fetch("https://api.themoviedb.org/3/search/movie?api_key="+TMDB_KEY+"&language=en-US&query="+encodeURIComponent(f.t)).then(function(r){return r.json();}).then(function(d){
      var m=(d.results||[]).filter(function(r){var a=nrm(r.title||""),b=nrm(f.t);return r.poster_path&&(a===b||a.indexOf(b)===0||b.indexOf(a)===0);})[0];
      cache[f.t]=m?"https://image.tmdb.org/t/p/w342"+m.poster_path:"";if(m)POSTERS[f.t]=cache[f.t];
    }).catch(function(){}).then(function(){if(--left===0)done();});
  },i*60);});
}
loadPosters();
</script>
